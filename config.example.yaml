# Blast Radius Configuration Example
# Copy this to ~/.config/blastradius/config.yaml and customize.

# Unix domain socket path (default: /tmp/blastradius.sock)
socket_path: "/tmp/blastradius.sock"

# Directories to scan for .env* files on startup.
# If empty, falls back to your home directory.
project_roots:
  - "~/projects"
  - "~/work"

# Directories to always skip during scanning (performance + noise reduction).
# These are merged with strong built-in defaults.
skip_dirs:
  - "node_modules"
  - ".git"
  - "vendor"
  - "dist"
  - "build"
  - ".next"
  - "target"

# Ignore files to respect (in addition to built-in behavior).
# .blastradiusignore is always useful for tool-specific exclusions.
ignore_files:
  - ".gitignore"
  - ".blastradiusignore"

# Future: log level
log_level: "info"

# Pillar 5 - Runtime Environment Hygiene
# Define any commands whose output should be scanned for secrets.
# Only the first command (printenv) has auto_on_prompt enabled by default.
pillar5_commands:
  - name: "default-env"
    cmd: "printenv"
    auto_on_prompt: true
  - name: "k8s-secrets"
    cmd: "kubectl get secrets --ignore-not-found -o yaml"
    auto_on_prompt: false

# Clipboard auto-clear timeout in seconds (Pillar 5)
clipboard_clear_seconds: 30

# Pillar 2 — Illegitimate Secret Residue Hunter ("Crumbs")
# Scans only the high-risk directories you list (never full disk).
# Detects forgotten vault exports (Bitwarden, Dashlane, 1Password) + generic high-entropy secret dumps.
# Always runs the complete fixed detector set when enabled (no selective disable for dangerous artifacts).
residue_hunter:
  enabled: false
  target_dirs:
    - "~/Downloads"
    - "~/Documents"
    - "~/Desktop"
    # Add more if you have specific backup volumes or folders an attacker would look in.
    # - "~/backups"
  flag_suspicious_filenames: true   # catches obvious names even without deep parsing
  # (detectors and thresholds are intentionally not user-configurable in v1)