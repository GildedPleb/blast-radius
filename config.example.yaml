# Blast Radius Configuration
# ==============================================================================
# Copy this file to ~/.config/blastradius/config.yaml and customize.
#
# This is the single source of truth for how Blast Radius discovers secrets
# where they *should* be (Pillar 1), finds them where they *should not* be
# (Pillar 2), and helps you clean up the common escape routes (Pillars 3-5).
#
# The Unix domain socket path is a **hard-coded security invariant**:
#   ~/.local/state/blastradius/blastradius.sock
# (0700 private directory + 0600 socket + capability token authentication).
# It is deliberately NOT user-configurable.
#
# For the full architectural framing, see:
#   docs/pillars/idiomatic_pillars.md
#
# Philosophy: minimal, hash-only, local-only, safe degradation, no new
# broad permissions, and "fuck you, don't put secrets in dangerous places."

# ------------------------------------------------------------------------------
# Core (top-level only)
# ------------------------------------------------------------------------------
# Only truly cross-cutting, non-pillar-specific settings live here.

log_level: "info"   # debug | info | warn | error   (future — currently advisory)

# ==============================================================================
# PILLAR 1 — Legitimate Secret Discovery
# "Finding and collecting secrets from where they *should* be."
#
# This is the foundation. Pillar 1 builds the ground-truth registry by
# deliberately scanning the locations you told it to trust (.env* files
# inside your project roots, and optionally Bitwarden via the official CLI).
#
# Everything else in the system (duplicates, history scrub, runtime checks,
# clipboard, residue hunting) compares against this registry.
#
# Core question it answers: "What secrets exist in the places we deliberately put them?"
#
# Security model:
# - Only walks directories you explicitly list.
# - Respects .gitignore + .blastradiusignore + built-in safe skips.
# - Never stores plaintext — only SHA-256 hashes.
# - Key filtering (ignore_patterns) keeps noise out of the registry.
# ==============================================================================

pillar1:
  sources:
    # ------------------------------------------------------------------
    # env — .env* file scanning (the original and primary source)
    # ------------------------------------------------------------------
    env:
      enabled: true
      options:
        # Directories (and their subdirectories) that will be walked for
        # .env, .env.local, .env.production, etc.
        #
        # Use ~ for home-relative paths. These are the *only* places
        # Pillar 1 will ever look for legitimate secrets.
        project_roots:
          - "~/projects"
          - "~/work"
          # - "~/src"
          # - "/Volumes/work"   # external volumes are fine

        # Directory basenames that are *never* descended into.
        # This is both a performance win and a noise-reduction win.
        # These supplement a small built-in safe list.
        skip_dirs:
          - "node_modules"
          - ".git"
          - "vendor"
          - "dist"
          - "build"
          - ".next"
          - "target"
          - "out"
          - ".cache"
          - "coverage"
          - ".venv"
          - "__pycache__"
          # Add anything else that is huge or full of generated secrets.

        # Files whose ignore rules (gitignore syntax) will be respected
        # during the walk. Later files win for conflicting rules.
        ignore_files:
          - ".gitignore"
          - ".blastradiusignore"

        # Keys that should *never* be treated as secrets, even if they
        # look high-entropy. Supports four forms:
        #   exact, PREFIX*, *SUFFIX, PREFIX*SUFFIX
        #
        # This is the primary defense against false positives in your
        # legitimate secret registry. Keep this list aggressive.

        # env_file_patterns (POSITIVE INCLUDE LIST — P1 authority declaration)
        # List the exact file globs you consider legitimate secret containers
        # for this env source. Only files matching these patterns under the
        # project_roots will have their secrets collected into the registry.
        #
        # Default (when omitted or empty) = [".env*"] for full backward compat.
        #
        # Examples:
        #   env_file_patterns:
        #     - ".env.local"
        #     - ".env.*.local"
        #     - ".private"
        #     - ".secret"
        #     - ".pk"
        #     - ".cert"
        #
        # These patterns define what Pillar 1 "owns". Pillar 2 will never
        # report a matching file as a crumb (P1 has priority and authority).
        ignore_patterns:
          - "PATH"
          - "HOME"
          - "PWD"
          - "USER"
          - "SHELL"
          - "TERM"
          - "LANG"
          - "LC_*"
          - "EDITOR"
          - "VISUAL"
          - "PAGER"
          - "COLORTERM"
          - "DISPLAY"
          - "XDG_*"
          - "DBUS_*"
          - "DESKTOP_SESSION"
          - "GNOME_*"
          - "KDE_*"
          - "SSH_*"
          - "GPG_*"
          - "LESS*"
          - "MORE"
          - "PS1"
          - "PS2"
          - "PROMPT*"
          - "HIST*"
          - "HISTSIZE"
          - "LOG_*"
          - "*_NONSECRET"
          - "BUILD_*"
          - "CI_*"
          - "NODE_ENV"
          - "DEBUG"
          - "TEST_*"
          # Add every non-secret key your projects and tools emit.

    # ------------------------------------------------------------------
    # bitwarden — official Bitwarden CLI collector (hard-coded, owned by us)
    # ------------------------------------------------------------------
    # Requires: `bw` binary in PATH + logged-in / unlocked session.
    # This source participates in the same registry, rescan, duplicates,
    # and status surfaces as the env source.
    #
    # bitwarden:
    #   enabled: true
    #   options:
    #     ignore_patterns:
    #       - "dev-*"
    #       - "*_test"
    #       # Add per-source ignore patterns here (they are merged with
    #       # the global picture via GetSourceIgnorePatterns).

# ==============================================================================
# PILLAR 2 — Illegitimate Secret Residue ("Crumbs")
# "Finding and collecting secrets from where they *should not* be."
#
# This is the deliberate inversion of Pillar 1.
#
# It only ever scans a small number of high-likelihood "residue sinks"
# that a human would actually use when they fuck up (Downloads, Documents,
# Desktop, plus anything you add). It looks for:
#   - Exported vault dumps (Bitwarden JSON/CSV, Dashlane, 1Password, etc.)
#   - Generic high-entropy blobs that look like someone dumped secrets
#
# It is *advisory only* — it will never delete anything for you.
#
# Core question it answers: "Where have secrets leaked into places they
# were never supposed to exist?"
#
# HARD RULES:
# - Never asks for Full Disk Access.
# - Detectors are fixed and *always* run when enabled (no user knob to
#   turn off detection for dangerous artifacts).
# - Only the hashes of interesting strings ever leave the scan.
# ==============================================================================

pillar2:
  enabled: false                 # opt-in

  # Pillar 2 finds secrets where they should not be.
  #
  # Declare the real locations that matter and give each one the narrow,
  # location-appropriate files[] patterns for the kind of garbage that actually
  # ends up there.
  #
  # This is the entire point of the model.

  dirs:
    # === High-risk user dump folders ===
    # People intentionally export things here. Broad scanning is reasonable.
    - path: "~/Downloads"
      files: ["**/*"]
    - path: "~/Documents"
      files: ["**/*"]
    - path: "~/Desktop"
      files: ["**/*"]

    # === Real materialization locations ===
    # These are where accidental residue actually tends to end up.
    # Patterns are deliberately narrower and tailored to each surface.

    - path: "/tmp"
      files:
        # Editor artifacts (people do `vim /tmp/foo` when desperate)
        - "**/*.swp"
        - "**/*.swo"
        - "**/*~"
        - "**/.#*"
        # Manual backup / temp files people create while debugging
        - "**/*.bak"
        - "**/*.backup"
        - "**/*_backup*"
        - "**/*.tmp"
        # Obvious dangerous names
        - "debug*"
        - "*secret*"
        - "*creds*"
        - "*password*"
        - "*token*"
        - "temp*secret*"
        - "*.env*"

    - path: "~/tmp"
      files:
        # Same editor + manual backup logic as /tmp, but in the user's home tmp
        - "**/*.swp"
        - "**/*.swo"
        - "**/*~"
        - "**/.#*"
        - "**/*.bak"
        - "**/*.backup"
        - "**/*_backup*"
        - "**/*.tmp"
        - "debug*"
        - "*secret*"
        - "*creds*"
        - "*password*"
        - "*.env*"

    - path: "~/Library/Logs"
      files:
        # Logs and crash reports are less likely to have editor swaps,
        # more likely to have leaked strings in filenames or content.
        - "*secret*"
        - "*password*"
        - "*token*"
        - "*key*"
        - "*creds*"
        - "*crash*"
        - "*debug*"

    - path: "~/.cache"
      files:
        # Cache directories sometimes accumulate debug/temp artifacts.
        - "*secret*"
        - "*password*"
        - "debug*"
        - "*token*"
        - "*creds*"

    # === Project / development trees (opt-in) ===
    # Many people leave debug files, swaps, and manual backups inside active work.
    # This is high-value but requires more surgical patterns.
    # - path: "~/dev"
    #   files:
    #     # Editor residue left next to files being edited
    #     - "**/*.swp"
    #     - "**/*.swo"
    #     - "**/*~"
    #     - "**/.#*"
    #     # Manual debug / backup files
    #     - "**/debug*"
    #     - "**/*secret*"
    #     - "**/*.env*"
    #     - "**/*.bak"
    #     - "**/*.backup"
    #     - "**/*_backup*"
    #     - "**/*.tmp"

    # You can (and should) add any other locations that are real in your workflow.
    # The strength of the model is that each directory gets the patterns that
    # actually match the mistakes people make in *that* place.

  # =====================================================================
  # CRITICAL RULE: PILLAR 1 HAS AUTHORITY OVER PILLAR 2
  # =====================================================================
  # Pillar 1 declares its "approved secret containers" via
  #   pillar1.sources.env.options.env_file_patterns
  # (e.g. [".env.local", ".env.*.local", ".private", ".secret", ".pk", ".cert"]).
  #
  # ANY file that matches those patterns under a P1 project_root is
  # **off-limits** to Pillar 2. It will never be reported as a crumb,
  # even if the exact same directory appears in a pillar2.dirs[] entry
  # with files: ["**/*"].
  #
  # This is not a warning. It is automatic, silent, correct behavior.
  # P1 wins. Always.
  #
  # This enables the three supported stories:
  # 1. P1 and P2 on completely separate directories → no interaction.
  # 2. P1 env source disabled → P2 can hunt everything under its dirs.
  # 3. Same directory under both: P1 claims only its listed env patterns;
  #    P2 sees everything else (source code, debug dumps, wrong-named envs, etc.).
  #
  # (detectors, entropy thresholds, and size gates are intentionally not
  #  user-configurable. The job is "fuck you, don't do this.")

# ==============================================================================
# PILLAR 3 — History Hygiene
# "Removing secrets from places where they accumulated over time through normal use."
#
# This is a *reactive cleanup* pillar. It operates on the historical record
# (shell history files) after secrets have already appeared in commands.
# It is deliberately NOT a PTY redaction layer
#
# CONFIG (current surface):
#   enabled: true|false
#   mode: "delete" | "redact"
#   redact_placeholder: "[REDACTED]"   # or any string you prefer (e.g. "***")
#   history_files: []                  # explicit extra absolute paths (ALL are processed)
#   history_roots: []                  # additional base dirs searched for LCD names
#                                      # + their common rotated/backup siblings
#                                      # (e.g. .bash_history.1, *.old, *.bak, *.1-9).
#                                      # Default behavior (empty): just $HOME.
#                                      # Use this for containers, other user homes,
#                                      # mounted volumes, etc.
#
# Discovery model (addresses the major blast-radius gap):
#   One `blastradius scrub-history` (no --file) now covers the *full* surface:
#   - $HISTFILE (if set)
#   - Built-in LCD live files under each history_root (bash priority + zsh, ksh, fish, etc.)
#   - Auto-discovered rotated/backup siblings in the *same directories* as the live files
#     (.bash_history.1, .zsh_history.old, *.bak, *.1 .. *.9, *~ , etc.)
#   - Everything listed in history_files and history_roots.
#   This ensures secrets in restorable artifacts (backups, logrotate, dedup/restore)
#   are actually removed.
#
# Incremental model (receipt-driven, durable):
#   - We plant/append small `# blastradius-scrub-receipt:v2:...:regfp=...`
#     control lines inside the artifacts we scrub. These are the *deterministic*
#     signal for "has this file been rewritten/restored/rotated since we last
#     touched it?" and allow future runs to decide whether reprocessing is
#     required (especially when the Pillar 1 registry has grown with new secrets).
#   - When the Pillar 1 registry grows (new secrets), or a receipt is missing/stale,
#     or content fingerprints diverge, we re-inspect the necessary portions.
#   - No extra JSON state files on disk. Re-scan logic lives in the daemon.
#
# One-shot full work:
#   `blastradius scrub-history --full` (or --reset) ignores all existing receipts
#   and forces a complete pass over every discovered artifact. Useful after a
#   big restore or when you want to be absolutely sure.
#
# SECURITY NOTES:
# - Only secrets already in your Pillar 1 registry are ever scrubbed.
# - During the scrub pass, candidate values exist transiently in memory
#   (same model as every other pillar). They are never written anywhere.
# - Atomic temp-file + 0600 + rename discipline is preserved for all writes.
#
# SHELL SUPPORT (LCD + best effort):
#   bash (~/.bash_history + $HISTFILE) — Tier 1 priority, including rotated siblings
#   zsh (including EXTENDED_HISTORY format)
#   tcsh/csh, common ksh variants, fish (line-based best-effort; structured
#     YAML-ish redaction remains a separate future item)
#   dash / pure POSIX sh: graceful "no persistent history" handling
#
# The previous "only look after the last scrub-history marker in the file" trick
# is still used (for live append-mostly files) but is now augmented by the
# registry fingerprint in receipts so we don't miss new secrets in older regions
# or in rotated copies.
# ==============================================================================

pillar3:
  enabled: true
  mode: "redact"                 # or "delete" for removing whole entries
  redact_placeholder: "[REDACTED]"
  # history_roots:                # additional bases for LCD + auto-rotated discovery
  #   - "/home/otheruser"
  #   - "/mnt/container/root"
  # history_files:                # fully explicit outliers (all processed)
  #   - "/custom/path/to/.weird_history"

# ==============================================================================
# PILLAR 4 — Runtime Environment Hygiene
# The primitive function call (`blastradius env [name]`) that runs commands
# and detects known secrets in their output.
#
# The function does one thing: exec the configured cmd (direct only), search
# the output *content* for secrets (via unified detector + P1 registry hashes),
# surface the count in JSON + log to daemon log. Never shows secret values.
#
# --json is for prompt/machine readers. That's it.
#
# This is the pure primitive. Later (not here) we can invoke it from prompts
# or wrappers (e.g. every 30s). No timers here.
#
# HARD SECURITY INVARIANT:
# Every command listed here is **always** executed with direct exec
# (never /bin/sh -c, never a shell). This eliminates an entire class of
# shell-injection and arbitrary code execution risks from configuration.
#
# If you need pipes, redirection, complex logic, or environment setup:
#   1. Write a tiny wrapper script you control (e.g. ~/bin/scan-env)
#   2. Put the absolute (or PATH-resolvable) name of *that script* here.
#
# `enabled: true` marks commands for future prompt/automation use.
# ==============================================================================

pillar4:
  commands:
    - name: "default-env"
      cmd: "printenv"
      enabled: true

    # - name: "k8s-secrets"
    #   cmd: "kubectl get secrets --ignore-not-found -o yaml"
    #   enabled: false

    # - name: "docker-env"
    #   cmd: "/Users/you/bin/scan-docker"   # your wrapper that does the complex stuff
    #   enabled: false

# ==============================================================================
# PILLAR 5 — Clipboard Hygiene
# "Catching and limiting secrets that have reached one of the most
#  dangerous single-copy surfaces on a developer machine."
#
# On macOS the clipboard is an extremely high blast-radius location.
# This pillar lets you know when a known secret lands in it and can
# (in the future) auto-clear it.
#
# Today: the timer is declared; the actual auto-clear timer is not yet
# wired up in the clipboard command (status/check/clear work today).
# ==============================================================================

pillar5:
  clear_seconds: 30   # seconds after which a detected secret in the clipboard
                      # should be cleared (future — not yet enforced)

# ------------------------------------------------------------------------------
# That's it. Everything else is either a hard-coded security invariant
# or lives inside the five pillars above.
#
# After editing, a `blastradius status` (with the daemon running) is the
# quickest way to see that your config was loaded the way you intended.
# ------------------------------------------------------------------------------